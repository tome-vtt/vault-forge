[package]
name = "vault-forge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
ureq = "3.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

# The stand-in converter the conversion tests run in place of ttrpg-convert-cli.
[[bin]]
name = "stand-in-converter"
path = "tests/stand_in/converter.rs"
test = false
doc = false
