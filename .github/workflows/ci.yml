name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    # A pull request that changes only docs/ skips the check job. Pushes run it, bar a push to
    # master whose tree equals its merged pull request's head that already passed CI (decide).
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  # A release merge re-checks the exact tree its promotion pull request passed; skip that rerun.
  # Anything it cannot confirm (no merged PR, another tree, no green run, an API error) runs check.
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          run=true
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/master ]; then
            head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "master")][0].head.sha // empty') || head=
            if [ -n "$head" ]; then
              tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || tree=
              head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) || head_tree=
              green=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&status=success" \
                --jq '[.workflow_runs[] | select(.path | startswith(".github/workflows/ci.yml"))] | length') || green=0
              echo "PR head $head, tree $tree, head tree $head_tree, green CI runs ${green:-0}"
              if [ -n "$tree" ] && [ "$tree" = "$head_tree" ] && [ "${green:-0}" -gt 0 ]; then
                run=false
              fi
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries for eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Bundle the pinned converter and check its sha256
        run: cargo run -p vault-forge-bundle -- target/bundle
